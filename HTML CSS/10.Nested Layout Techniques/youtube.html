<!DOCTYPE html>
<html>

<head>
   <style>
      p {
         font-family: Arial, Helvetica, sans-serif;
         margin-top: 0;
         margin-bottom: 0;
      }

      .image {
         width: 300px;
         margin-top: 25px;
         margin-bottom: 0px;

      }

      .sundar {
         display: inline-block;
         vertical-align: top;
         margin-right: 15px;
         margin-bottom: 0px;
      }

      .box {
         display: block;
      }

      .text {
         font-weight: bold;
         margin-top: 0px;
         margin-bottom: 0px;
      }

      .yt-dp {
         display: inline-block;
         vertical-align: top;
      }

      .text {
         display: inline-block;
      }

      .profile-image {
         width: 40px;
         border-radius: 50%;
      }

      .header {
         margin-top: 0px;
         margin-bottom: 12px;
      }

      .vertical-block-2 {
         margin-bottom: 12px;
      }

      .chanel-name,
      .stats {
         font-size: 15px;
         color: rgb(96, 96, 96);
      }

      .chanel-name {
         margin-bottom: 5px;
      }
   </style>
</head>

<body>
   <input class="box" type="text" placeholder=" Search">
   <div class="sundar">
      <div class="vertical-block-2">
         <img class="image" src="youtube-sundar.jpg">
      </div>
      <div>
         <div class="yt-dp">
            <img class="profile-image" src="channel-1.jpeg">
         </div>
         <div class="text">
            <p class="header">Talking Tech and AI with Google <br>CEO Sundar Pichai!</p>
            <p class="chanel-name">Marques Brownlee</p>
            <p class="stats">3.4M views &#183 6 months ago</p>
         </div>
      </div>
   </div>
   <div class = "sundar">
      <div class="vertical-block-2">
         <img class="image" src="carry-thumbnail.webp">
      </div>
      <div>
         <div class ="yt-dp">
            <img class = "profile-image" src ="channel-2.jpeg">
         </div>
         <div class="text">
            <p class="header">Try not to laugh challenge #9</p>
            <p class ="chanel-name">Markpiler</p>
            <p class="stats">19M views &#183 4 years ago</p>
         </div>
      </div>
   </div>
</body>
</html>
