<!DOCTYPE html>
<html>
<head>
  <title>Follow Button</title>
  <style>
    .container {
      width: 400px;
      margin: 0 auto;
    }
    .image {
      width: 100%;
    }
    .follow-button {
      background-color: #3399FF;
      color: white;
      font-size: 16px;
      border-radius: 3px;
      padding: 10px 20px;
      cursor: pointer;
    }
    .follow-button:hover {
      background-color: #2EB82E;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="cute.jpg" class="image">
    <div class="follow-button">Follow</div>
  </div>
</body>
</html>
