<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Race Registration</title>
  </head>
  <body>
    <h1>Race Registration !</h1>
    <form>
      <div>
        <label for="first">First Name : </label>
        <input type="text" id="first" required/>
        <label for="last">Last Name : </label>
        <input type="text" id="last" required/>
      </div>
      <p>Select a Race :</p>
      <div>
        <label for="funrun">Fun Run 5k</label>
        <input type="radio" id="funrun" name="race" required/>
      </div>
      <div>
        <label for="half">Half Marathon</label>
        <input type="radio" id="half" name="race" required/>
      </div>
      <div>
        <label for="full">Full Marathon</label>
        <input type="radio" id="full" name="race" required/>
      </div>
      <div>
         <label for = "email" id="label">Email :</label>
         <input type = "email" name = "email" id = "email" required>
      </div>
      <div>
         <label for = "pass" id="label">Password :</label>
         <input type = "password" name = "password" id = "pass" required>
      </div>
      <div>
        <label for = "division">Select age Group</label>
        <select name = "division" id = "division">
          <option value = "kids">under 18</option>
          <option value = "kids">18-30</option>
          <option value = "kids">30-60</option>
          <option value = "kids">60 plus</option>
        </select>
      </div>
      <button>Register</button>
    </form>
  </body>
</html>
