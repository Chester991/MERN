<!DOCTYPE html>
<html>
  <head>
    <style>
      .twitter {
        width: 500px;
        height: 70px;
        border-style: none;
        display: flex;
        align-items: center;
        box-shadow: 2px 2px 25px rgba(0, 0, 0, 0.4);
        margin-top: 20px;
        margin-left: 20px;
        border-radius: 8px;
      }
      .cat {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: inline-block;
        margin-left: 11px;
      }
      .text {
        display: inline-block;
        color: rgb(100, 100, 100);
        margin-left: 20px;
        font-size: 18px;
      }
      .butt {
        display: inline-block;
        margin-left: 180px;
        background-color: rgb(29, 161, 242);
        width: 80px;
        height: 35px;
        border-radius: 35px;
        box-shadow: none;
        border-color: white;
        color: aliceblue;
        font-weight: bold;
        font-size: 15px;
        border-style: none;
      }
    </style>
  </head>
  <body>
    <div class="twitter">
      <img class="cat" src="car.webp" />
      <p class="text">What's happening?</p>
      <button class="butt">Tweet</button>
    </div>
  </body>
</html>
