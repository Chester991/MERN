<!DOCTYPE html>
<html>
  <head>
    <style>
      .oliver {
        margin-left: 30px;
        width: 180px;
        display: inline-block;
        border-color: red;
        box-shadow:  0 0 5px rgba(0, 0, 0, 0.3);
      }
      .dp {
        width: 180px;
        height: 180px;
        display: block;
      }
      .name {
        font-size: 20px;
        margin-top: 4px;
        margin-bottom: 0.4px;
        font-weight: bold;
        margin-left: 5px;
      }
      .mutal {
        margin-top: 0px;
        color:rgb(85, 85, 85);
        margin-bottom :4px;
        margin-left: 5px;
      }
      .friend{
         background-color:rgb(29 161 242);
         margin-top:4px;
         color:white;
         border:none;
         padding-top:6px;
         padding-bottom: 6px;
         padding-left:17px;
         padding-right:17px;
         border-radius:3px;
         margin-left:6px;
         margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="oliver">
      <img class="dp" src="oliver.jpg" />
      <p class="name">Oliver</p>
      <p class="mutal">2 mutual friends</p>
      <button class="friend">Add Friend</button>
    </div>
  </body>
</html>
