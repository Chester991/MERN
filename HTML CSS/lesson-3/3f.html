<!DOCTYPE html>
<html>
  <head>
   <style>
      .amazon:hover{
         color : red;
         transition : color 0.25s;
      }
      .Nike{
         font-weight: bold;
         font-size: 30px;
         margin-top: 20px;
         margin-bottom : 20px;
      }
      .money{
         color: rgb(0,118,0);
         font-weight : bold;
         font-size : 20px;
      }
      .free{
         font-size:20px;
      }
      .cart{
         color : blac;
         background-color: rgb(255,216,20);
         padding: 10px 20px;
         border-radius : 25px;
         border-width: 0;  
      }
      .cart:hover{
         cursor: pointer;
      }
      .cart:active{
         opacity: 0.5;
         cursor : pointer;
      }
      .buy:hover{
         opacity: 0.9;
         cursor : pointer;
      }
      .buy:active{
         opacity:0.5;
      }
      .buy{
         background-color: rgb(255,164,28);
         padding : 10px 20px;
         border-radius : 25px;
         border-width: 0;
      }  
   </style>
  </head>
  <body>
    <a class="amazon" href="https://www.amazon.in/">Back to Amazon</a>
    <p class = "Nike">Nike Black Running Shoes</p>
    <p class = "money">$39 - in stock</p>
    <p class = "free">Free delivery tomorrow</p>
    <button class = "cart">Add to Cart</button>
    <button class = "buy">Buy now</button>
  </body>
</html>
