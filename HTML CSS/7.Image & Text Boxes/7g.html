<!DOCTYPE html>
<html>
   <head>
      <style>
         .image{
            width:40px;
            height:   40px;
            vertical-align: middle;
            border-radius: 50%;
         }
         .box{
            border: none;
            font-size: 13px;
            padding-left: 6px;
         }
         .butt{
            width:60px;
            height:30px;
            border-radius:15px;
            border-style: none;
            color:white;
            background-color: rgb(29 161 242);
            font-weight: bold;
            font-size:13px;
         }
      </style>
   </head>
   <body>
      <img class="image" src="begula.jpg">
      <input class="box" type = "text" placeholder="What's happening?">
      <button class="butt">Tweet</button>
   </body>
</html>
