<!DOCTYPE html>
<html>
  <head>
    <style>
      th,td{
        border:1px solid black;
        padding : 8px;
        text-align:center;
      }
      table{
        border-collapse: collapse;
      }
    </style> 
  </head>
  <body>
    <table>
      <tr>
        <td>Row 1, Column 1</td>
        <td>Row 1, Column 2</td>
      </tr>
      <tr>
        <td>Row 2, Column 2</td>
        <td>Row 2, Column 1</td>
      </tr>
    </table>
  </body>
</html>
