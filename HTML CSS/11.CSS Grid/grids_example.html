<!DOCTYPE html>
<html>
  <head>
    <style>
      .sample {
        display: grid;
        grid-template-columns: 100px 200px 120px;
       /* if we make 4 divs the 4th one will become new row. */
      }
      .first {
        background-color: aqua;
      }
      .second {
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <div class="sample">
      <div class="first">div 1</div>
      <div class="second">div 2</div>
      <div style = "background-color:tomato;">div 3</div>
      <div style="background-color: rebeccapurple;">div 5</div>
    </div>
  </body>
</html>
