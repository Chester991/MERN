   <!DOCTYPE html>
   <html>
   <head>
      <style>
         .but1,
         .but2,
         .but3{
            background-color: green;
            margin-right:20px;
            margin-left: 20px;
            color:white;
            border: none;
            padding-top:7px;
            padding-bottom: 7px;
            padding-left: 15px;
            padding-right: 15px;
            font-size: larger;
            transition: padding 0.15s;
         }
         .but1:hover,
         .but2:hover,
         .but3:hover{
            cursor: pointer;
            padding-left: 25px;
            padding-right: 25px;
         }
      </style>
   </head>
   <body>
      <button class="but1">One</button>
      <button class="but2">Two</button>
      <button class="but3">Three</button>
   </body>
   </html>
