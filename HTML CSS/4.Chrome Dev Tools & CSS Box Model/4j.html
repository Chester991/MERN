<!DOCTYPE html>
<html>
  <head>
    <style>
      .shad {
        padding-left: 17px;
        padding-right: 17px;
        padding-top: 12px;
        padding-bottom: 12px;
        background-color: green;
        color: white;
        border-style: none;
        font-size: larger;
        cursor: pointer;
        box-shadow: 5px 5px 6px rgba(0, 0, 0, 0.3);
      }
      .shad:active{
         margin-top:5px;
         margin-left : 5px;
         box-shadow:none;
      }
    </style>
  </head>
  <body>
    <button class="shad">Shadow</button>
  </body>
</html>
