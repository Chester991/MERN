<!DOCTYPE html>
<html>
   <head>
      <style>
         .butt{
            color:white;
            background-color: green;
            padding-left: 15px;
            padding-right:14px;
            padding-top: 8px;
            padding-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
            border-style: none;
            transition-duration: 0.5s;
         }
         .butt:hover{
            padding-top:20px;
            padding-bottom:20px;
            padding-right: 40px;
            padding-left: 40px;
            cursor: pointer;
            font-size: 30px;
            
         }
      </style>
   </head>
   <body>
      <button class="butt">Stretch</button>
   </body>                                                                                                                                                                                                                                  
</html>
