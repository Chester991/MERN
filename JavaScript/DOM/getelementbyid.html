<!DOCTYPE html>
<html lang="en">

<head>
  <title>DOM - Query Selector</title>
  <style>
    .red-color {
      color: red;
    }
    .underline {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <nav class="block">
    <p class="paragraph">Welcome to my website</p>
  </nav>  

  <div class="block">
    <h4>Hey There, My name is <span class = "remove" id="username">Ayush</span></h4>
    <p class="paragraph">Here is a code for you</p>
    <pre><code>console.log('Hey There')</code></pre>
  </div>

  <script>
    const el = document.getElementById("username");
    //console.log(el.innerText);
    //el.innerText = "John Doe"
    //el.classList.add("red-color" , "underline") // adds the class red-color inside 
    el.classList.remove("remove"); // removes the class named remove   
    el.style.textDecoration = "underline";
    el.style.color = "tomato";
    console.log(el.parentElement);
    el.parentElement.style.background = "grey";

  </script>
