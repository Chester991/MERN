<!DOCTYPE html>
<html lang="en">
<head>
  <title>DOM - Query Selector</title>
</head>
<body>
  <nav class="block">
    <p class="paragraph">Welcome to my website</p>
  </nav>

  <div class="block">
    <h4>Hey There, My name is <span id="username">Ayush</span></h4>
    <p class="paragraph">Here is a code for you</p>
    <pre><code>console.log('Hey There')</code></pre>
  </div>

  <div>
    <div>
    <h3>This is div 2</h3>
    </div>
  </div>

  <script>
    // query selector
    const body = document.querySelector('body');
    // body.innerHTML = '<h1>Hacked</h1>' -> 
    //console.log(body.innerHTML); :- Return a string consting of whole code

    // Changing elements inside div
    //const div = document.querySelector('div');
    //div.innerHTML = '<h1>This div is changed</h1>'

    // Changing name using id
    const username = document.querySelector("#username");
    console.log(username.innerHTML);
    
  </script>
</body>
</html>
