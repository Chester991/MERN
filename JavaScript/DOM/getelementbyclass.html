<!DOCTYPE html>
<html lang="en">
<head>
  <title>DOM - Query Selector</title>
</head>
<body>
  <nav class="block">
    <p class="paragraph">Welcome to my website</p>
  </nav>

  <div class="block">
    <h4>Hey There, My name is <span id="username">Ayush</span></h4>
    <p class="paragraph">Here is a code for you</p>
    <pre><code>console.log('Hey There')</code></pre>
  </div>

  <div>
    <div>
    <h3>This is div 2</h3>
    </div>
  </div>

  <script>
    const elements = document.getElementsByClassName("block"); // multiple elements milne wale hai
    for(let i = 0;i<elements.length; i++){
        elements.item(i).style.background = "blue";
    }
  </script>

</body>
</html>
