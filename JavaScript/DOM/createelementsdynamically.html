<!DOCTYPE html>
<html lang="en">

<head>
    <title>DOM - Query Selector</title>
</head>

<body>
    <nav class="block">
        <p class="paragraph">Welcome to my website</p>
    </nav>

    <div class="block">
        <h4 id="name-block">Hey There, My name is <span id="username">Ayush</span></h4>
        <p class="paragraph">Here is a code for you</p>
        <pre><code>console.log('Hey There')</code></pre>
    </div>

    <div>
        <div>
            <h3>This is div 2</h3>
        </div>

        <!-- <button onclick="handlebuttonClick()">Click Me !</button> -->
        <button id="clickButton">Click Me !</button>
    </div>

    <div id = "mycontainer">

    </div>


</body>

<script>
 // When i click on click me button i want new elements to be created inside div/dom 
 // when i click on click me button we want to add some elements inside div

 const button = document.getElementById('clickButton');
 const container = document.getElementById('mycontainer');

 button.addEventListener('click',function(){
    const el = document.createElement('h1');
    el.innerText = 'Billi';
    container.appendChild(el);
 });

 let count = 1;
 button.addEventListener('click',function(){
    const el = document.createElement('li');
    el.innerText = count;
    container.appendChild(el);
    count++;
 });

</script>

</html>
